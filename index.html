    <!-- Critical CSS inlined to avoid flash before stylesheets load -->
    <style>
      :root {
        --bg-primary: #fbf4d6;
        --text-primary: #2b2a24;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="dark"]):not([data-theme="light"]) {
          --bg-primary: #18191b;
          --text-primary: #e8eaed;
        }
      }
      [data-theme="dark"] {
        --bg-primary: #18191b;
        --text-primary: #e8eaed;
      }
      html {
        background: var(--bg-primary);
      }
      body {
        margin: 0;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: "Inter", system-ui, sans-serif;
      }
      .no-js-warning {
        max-width: 640px;
        margin: 6rem auto;
        padding: 1.5rem;
        text-align: center;
      }
    </style>

    <!-- Set theme before paint to prevent flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Fonts (font-display: swap via &display=swap) -->
